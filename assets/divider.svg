<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" fill="none">
  <defs>
    <linearGradient id="scanEffect" x1="-50%" y1="0%" x2="150%" y2="0%">
      <stop offset="0%" stop-color="#0065C9" />
      <stop offset="45%" stop-color="#0065C9" />
      <stop offset="50%" stop-color="#02CCFE" />
      <stop offset="55%" stop-color="#0065C9" />
      <stop offset="100%" stop-color="#0065C9" />
      
      <animate 
        attributeName="x1" 
        from="-50%" 
        to="100%" 
        dur="2.5s" 
        repeatCount="indefinite" />
      <animate 
        attributeName="x2" 
        from="150%" 
        to="300%" 
        dur="2.5s" 
        repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <path d="M0 3H1200" stroke="url(#scanEffect)" stroke-width="6" stroke-linecap="round" />
</svg>
